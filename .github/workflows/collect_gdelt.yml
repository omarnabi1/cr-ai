name: Daily GDELT Collection
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-collect.txt
      - run: pip install -r requirements-collect.txt
      - name: Run GDELT collector
        run: |
          mkdir -p data/raw/geopolitical_lit data/raw/historical_conflicts logs
          python3 scripts/collection/gdelt_collector.py
          python3 scripts/collection/historical_collector.py
        env:
          ACLED_API_KEY: ${{ secrets.ACLED_API_KEY }}
          ACLED_EMAIL: ${{ secrets.ACLED_EMAIL }}
      - name: Upload to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
        run: python3 scripts/upload_to_hf.py
