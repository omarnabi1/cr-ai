name: Daily RSS Collection
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run RSS collector
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          mkdir -p data/raw/geopolitical_lit data/raw/social_media logs
          python3 scripts/collection/master_collector.py

      - name: Upload data to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
        run: python3 scripts/upload_to_hf.py

      - name: Commit log
        run: |
          git config user.name "CR-AI Bot"
          git config user.email "cr-ai@noreply.github.com"
          git add logs/ || true
          git diff --staged --quiet || git commit -m "chore: rss collection $(date -u +%Y-%m-%d)"
          git push || true
