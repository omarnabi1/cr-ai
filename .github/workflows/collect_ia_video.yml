name: Daily Internet Archive Video Collection
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run IA video collector
        run: |
          mkdir -p data/raw/social_media logs
          python3 scripts/collection/youtube_collector.py
      - name: Upload to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
        run: python3 scripts/upload_to_hf.py
